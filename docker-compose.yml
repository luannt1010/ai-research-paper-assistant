services:
  backend:
    build:
      context: . # docker cần đọc nhiều file config, requirements...
      dockerfile: Dockerfile
    image: paper-assistant:latest # Đặt tên sau khi build
    ports:
      - "127.0.0.1:8000:8000" #ĐỊA_CHỈ_MÁY_BẠN:PORT_MÁY_BẠN:PORT_TRONG_CONTAINER
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434 #địa chỉ để docker truy cập ollama trên máy host
    volumes:
      - ./.env:/app/.env:ro #ĐƯỜNG_DẪN_TRÊN_WINDOWS:ĐƯỜNG_DẪN_TRONG_CONTAINER:QUYỀN
      - ./papers:/app/papers:ro
      - ./configs:/app/configs:ro
    restart: unless-stopped

# context xác định đường dẫn đến thư mục chứa Dockerfile hoặc URL đến kho lưu trữ Git.

  frontend:
    image: paper-assistant:latest
    ports:
      - "127.0.0.1:8501:8501"
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_BASE_URL: "http://backend:8000"

